name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-appx-arm64-3.2.0
  cancel-in-progress: false

jobs:
  release-windows-arm64-appx:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Microsoft Store Arm64 AppX package
        run: npm run build:appx -- --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify Arm64 AppX package
        shell: pwsh
        run: |
          $VERSION = node -p "require('./package.json').version"
          if ($VERSION -ne "3.2.0") {
            Write-Error "Expected package.json version 3.2.0, got $VERSION"
            exit 1
          }
          $APPX = Get-ChildItem release\*.appx -ErrorAction SilentlyContinue
          if (-not $APPX) {
            Write-Error "no .appx in release\ - Microsoft Store submission package is missing"
            exit 1
          }
          if ($APPX.Count -ne 1) {
            Write-Error "Expected exactly one .appx, got $($APPX.Count)"
            exit 1
          }
          $RENAMED = Join-Path $APPX.DirectoryName "Flo.Cafe.3.2.0-arm64.appx"
          Move-Item $APPX.FullName $RENAMED -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $ZIP = [System.IO.Compression.ZipFile]::OpenRead($RENAMED)
          try {
            $ENTRY = $ZIP.GetEntry("AppxManifest.xml")
            if (-not $ENTRY) {
              Write-Error "AppxManifest.xml is missing from $RENAMED"
              exit 1
            }
            $READER = [System.IO.StreamReader]::new($ENTRY.Open())
            try {
              $MANIFEST = $READER.ReadToEnd()
            } finally {
              $READER.Dispose()
            }
          } finally {
            $ZIP.Dispose()
          }
          if ($MANIFEST -notmatch 'ProcessorArchitecture="arm64"') {
            Write-Error "Expected ProcessorArchitecture=`"arm64`" in AppxManifest.xml"
            exit 1
          }
          Write-Host "Built Arm64 AppX: $(Split-Path $RENAMED -Leaf)"

      - name: Upload Arm64 AppX to GitHub release
        shell: pwsh
        run: |
          $VERSION = node -p "require('./package.json').version"
          gh release upload "$VERSION" (Get-ChildItem release\*-arm64.appx | Select-Object -ExpandProperty FullName) --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Arm64 AppX workflow artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: flocafe-3.2.0-arm64-appx
          path: release/*-arm64.appx
          retention-days: 14
